<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Notifications - TalkTime by ADEA Foundation</title>
    <!-- Early auth redirect - prevents FOUC on protected pages -->
    <script>
        if (!localStorage.getItem('volunteer_talktime_access_token')) {
            window.location.replace('/volunteer/login');
        }
    </script>

    <!-- Brand Theme System -->
    <link rel="stylesheet" href="/shared/css/brand-theme.css?v=4">
    <link rel="icon" type="image/x-icon" href="/talktime.ico">
    <link rel="manifest" href="/volunteer/manifest.json">
    <meta name="theme-color" content="#D10100">
    <link rel="apple-touch-icon" href="/volunteer/icons/apple-touch-icon.png">
    <script defer src="/shared/js/pwa-install.js?v=4"></script>
    <meta name="description" content="View and manage your TalkTime notifications">
    <link rel="canonical" href="https://talktime.adeafoundation.org/volunteer/notifications">

    <!-- CSS (all sync to prevent layout shift) -->
    <link rel="stylesheet" href="/shared/css/tailwind.min.css">
    <link rel="stylesheet" href="/shared/fonts/google/fonts.css">
    <link rel="stylesheet" href="/shared/fonts/fontawesome/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive-framework.css">
    <link rel="stylesheet" href="css/responsive-forms.css">
    <link rel="stylesheet" href="css/enhanced-mobile-nav.css">
    <link rel="stylesheet" href="css/volunteer-dashboard.css">

    <!-- Deferred Scripts (non-render-blocking) -->
    <script defer src="/shared/js/brand-config.js?v=6"></script>
    <script defer src="js/dashboard-nav.js?v=7"></script>
    <script defer src="/shared/js/jwt-auth-utils.js?v=5"></script>
    <script defer src="/shared/js/swr-fetch.js?v=1"></script>
    <script defer src="/shared/js/meeting-auto-launch.js?v=4"></script>
    <script defer src="/shared/js/newsletter-widget.js?v=4"></script>
    
    <style>
        /* Section heading - flat color, no gradient */
        .section-heading {
            color: #111827;
            font-weight: 700;
        }

        /* Page background override - match student design */
        .content-area {
            background: transparent;
        }

        /* Remove white card wrapper - let cards sit on page background */
        .notifications-wrapper {
            background: transparent;
            border: none;
            box-shadow: none;
        }

        /* ==========================================
           NOTIFICATION CARDS - Student Design Match
           Flat design with blue-accented unread states
           ========================================== */

        /* Notification Item - Flat Card Design */
        .notification-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            margin: 0 0 8px 0;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.15s ease;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            width: 100%;
        }

        .notification-item:last-of-type {
            margin-bottom: 0;
        }

        .notification-item:active {
            background: #f3f4f6;
        }

        @media (min-width: 768px) {
            .notification-item {
                padding: 16px;
            }
            .notification-item:hover {
                transform: translateY(-1px);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
                background: #fafafa;
            }
        }

        /* Read State - Clean white background */
        .notification-item.read {
            border-color: #f3f4f6;
            background: #ffffff;
        }

        .notification-item.read .notif-title {
            color: #374151;
        }

        .notification-item.read .notif-message {
            color: #6b7280;
        }

        /* Unread State - Blue accent (matches student design) */
        .notification-item.unread {
            border: 1px solid #d3d7ba;
            background: rgba(239, 246, 255, 0.5);
        }

        .notification-item.unread .notif-title {
            color: #111827;
        }

        .notification-item.unread .notif-message {
            color: #374151;
        }

        /* Type Icon - Circular (matches student design) */
        .notif-type-icon {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }

        .notif-type-icon.meeting {
            background: #dcfce7;
            color: #16a34a;
        }
        .notif-type-icon.reminder {
            background: #e7e9d9;
            color: #54602a;
        }
        .notif-type-icon.system {
            background: #f3e8ff;
            color: #9333ea;
        }
        .notif-type-icon.call {
            background: #dcfce7;
            color: #16a34a;
        }
        .notif-type-icon.canceled {
            background: #fee2e2;
            color: #dc2626;
        }
        .notif-type-icon.rescheduled {
            background: #ffedd5;
            color: #ea580c;
        }
        .notif-type-icon.message {
            background: #e7e9d9;
            color: #54602a;
        }

        /* Unread Indicator - Blue dot on icon (matches student) */
        .notif-unread-indicator {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #5f6a2d;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }

        /* Content */
        .notif-content {
            flex: 1;
            min-width: 0;
        }

        /* Title row with "New" badge */
        .notif-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .notif-title {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
            line-height: 1.4;
            word-break: break-word;
            flex: 1;
            min-width: 0;
        }

        /* "New" Badge for unread (matches student design) */
        .notif-new-badge {
            font-size: 12px;
            font-weight: 500;
            color: #54602a;
            background: #e7e9d9;
            padding: 2px 8px;
            border-radius: 9999px;
            flex-shrink: 0;
        }

        .notif-message {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .notif-time {
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notif-time i {
            font-size: 11px;
        }

        /* Actions - Hidden by default, show on hover (desktop) */
        .notif-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            opacity: 1;
            transition: opacity 0.15s ease;
        }

        @media (min-width: 768px) {
            .notif-actions {
                opacity: 0;
            }
            .notification-item:hover .notif-actions {
                opacity: 1;
            }
        }

        .notif-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 9999px;
            border: none;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .notif-action-btn:hover {
            background: #f3f4f6;
            color: #374151;
        }

        .notif-action-btn.delete:hover {
            background: #fef2f2;
            color: #ef4444;
        }

        /* Filter Pills */
        .filter-pills {
            display: flex;
            gap: 8px;
            padding: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .filter-pills::-webkit-scrollbar {
            display: none;
        }

        @media (max-width: 640px) {
            .filter-pills {
                padding-bottom: 8px;
            }
        }

        .filter-pill {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid #e5e7eb;
            background: white;
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .filter-pill:hover {
            border-color: #d1d5db;
            background: #f9fafb;
        }

        .filter-pill.active {
            background: var(--brand-primary, #D10100);
            border-color: var(--brand-primary, #D10100);
            color: white;
        }

        .filter-pill-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            margin-left: 6px;
            border-radius: 9px;
            background: rgba(0,0,0,0.1);
            font-size: 11px;
            font-weight: 600;
        }

        .filter-pill.active .filter-pill-count {
            background: rgba(255,255,255,0.2);
        }

        /* Skeleton Loading - Matches card design */
        .notif-skeleton {
            display: flex;
            gap: 12px;
            padding: 12px;
            margin: 0 0 8px 0;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #f3f4f6;
            width: 100%;
        }

        @media (min-width: 768px) {
            .notif-skeleton {
                padding: 16px;
            }
        }

        .notif-skeleton-icon {
            width: 40px;
            height: 40px;
            border-radius: 9999px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        .notif-skeleton-content {
            flex: 1;
        }

        .notif-skeleton-line {
            height: 14px;
            border-radius: 7px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
        }

        .notif-skeleton-line:last-child {
            width: 50%;
            margin-bottom: 0;
        }

        @keyframes skeleton-pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Date Group Header - Clean separator for card layout */
        .notif-date-group {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 0 8px;
            background: transparent;
        }

        .notif-date-group:first-child {
            padding-top: 0;
        }

        /* Empty State */
        .notif-empty {
            text-align: center;
            padding: 48px 24px;
        }

        .notif-empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #9ca3af;
        }

        /* Legacy spinner support */
        .loading {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="dashboard-page" style="opacity:0">
<script>/* fail-open: reveal the page even if a later script fails to parse on older browsers */setTimeout(function(){document.body.classList.add("page-ready");document.body.style.opacity="1";},1500);</script>
    <!-- Background Blobs - Hidden on mobile for performance -->
    <div class="blob bg-brand-primary w-96 h-96 top-0 left-0 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="blob bg-brand-secondary w-96 h-96 bottom-0 right-0 translate-x-1/2 translate-y-1/2"></div>

    <!-- Dashboard Navigation Container -->
    <div id="dashboard-nav-container"></div>

    <main class="content-area">
        <div class="max-w-3xl mx-auto w-full">
            <!-- Page Header -->
            <div class="flex flex-col gap-4 mb-6">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Notifications</h1>
                    <p class="text-sm text-gray-500 mt-1">Reminders, meeting changes and messages - tap one to open it.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="mark-all-read-btn" class="tt-btn-soft flex-1 min-w-0 justify-center" style="background:#fff;border:1px solid #e5e7eb;color:#374151;">
                        <i class="fas fa-check-double mr-2 text-gray-500"></i>
                        <span class="truncate">Mark All Read</span>
                    </button>
                    <button id="refresh-btn" class="tt-btn-soft flex-1 min-w-0 justify-center" style="background:#D10100;color:#fff;">
                        <i id="refresh-icon" class="fas fa-sync-alt mr-2"></i>
                        <span class="truncate">Refresh</span>
                    </button>
                </div>
            </div>

            <!-- Filter Pills -->
            <div class="filter-pills mb-6" id="filter-tabs">
                <button class="filter-pill active" data-filter="all">
                    All<span class="filter-pill-count" id="count-all">0</span>
                </button>
                <button class="filter-pill" data-filter="unread">
                    Unread<span class="filter-pill-count" id="count-unread">0</span>
                </button>
                <button class="filter-pill" data-filter="meeting">
                    Meetings<span class="filter-pill-count" id="count-meeting">0</span>
                </button>
                <button class="filter-pill" data-filter="reminder">
                    Reminders<span class="filter-pill-count" id="count-reminder">0</span>
                </button>
                <button class="filter-pill" data-filter="system">
                    System<span class="filter-pill-count" id="count-system">0</span>
                </button>
            </div>

            <!-- Notifications List - No wrapper, cards sit on page background -->
            <div class="notifications-wrapper">
            <div id="notifications-container">
                <!-- Loading State - Skeleton (hidden initially, shown by JS) -->
                <div id="loading-state" class="hidden">
                    <div class="notif-skeleton">
                        <div class="notif-skeleton-icon"></div>
                        <div class="notif-skeleton-content">
                            <div class="notif-skeleton-line"></div>
                            <div class="notif-skeleton-line"></div>
                        </div>
                    </div>
                    <div class="notif-skeleton">
                        <div class="notif-skeleton-icon"></div>
                        <div class="notif-skeleton-content">
                            <div class="notif-skeleton-line"></div>
                            <div class="notif-skeleton-line"></div>
                        </div>
                    </div>
                    <div class="notif-skeleton">
                        <div class="notif-skeleton-icon"></div>
                        <div class="notif-skeleton-content">
                            <div class="notif-skeleton-line"></div>
                            <div class="notif-skeleton-line"></div>
                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden notif-empty">
                    <div class="notif-empty-icon">
                        <i class="fas fa-bell-slash"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900 mb-2">All caught up!</h3>
                    <p class="text-gray-500 text-sm">No notifications right now. We'll let you know when something new arrives.</p>
                </div>

                <!-- Notifications will be populated here -->
                <div id="notifications-list"></div>
            </div>

            <!-- Pagination -->
            <div id="pagination-container" class="hidden border-t border-gray-200 py-4 mt-4">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="text-sm text-gray-700 text-center sm:text-left">
                        Showing <span id="pagination-info"></span>
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button id="prev-page-btn" class="flex-1 sm:flex-none px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Previous
                        </button>
                        <button id="next-page-btn" class="flex-1 sm:flex-none px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Next
                        </button>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    <script src="/shared/js/realtime-notifications.js?v=4"></script>
    <script src="/volunteer/js/pages/notifications-1.js?v=5"></script>

    <!-- Initialize TalkTimeAuth -->
    <script>
        if (typeof TalkTimeJWTAuth !== 'undefined') {
            window.TalkTimeAuth = new TalkTimeJWTAuth('volunteer');
        }
    </script>
</body>
</html>
