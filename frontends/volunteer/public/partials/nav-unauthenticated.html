<!-- Unauthenticated top nav: identical skeleton to the authenticated nav,
     with Log in | Sign up in place of the bell/name/avatar -->
<header id="main-header" class="fixed top-0 left-0 right-0 z-40 bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto flex items-center justify-between h-16 px-4 sm:px-6">
        <!-- Logo - black, no gradient -->
        <a href="/" class="flex items-center gap-2" aria-label="TalkTime Home">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7" viewBox="0 0 24 24" fill="none">
                <path stroke="#111827" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 3h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2z"></path>
            </svg>
            <span class="font-bold text-gray-900 tracking-tight text-lg">TALKTIME</span>
        </a>

        <!-- Log in | Sign up -->
        <div class="flex items-center gap-1 sm:gap-2">
            <a href="/volunteer/login" class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 rounded-lg hover:bg-gray-50 transition-colors">Log in</a>
            <span class="text-gray-300 select-none" aria-hidden="true">|</span>
            <a href="/volunteer/signup" class="inline-flex items-center px-3 py-2 text-sm font-semibold text-white rounded-lg transition-colors" style="background:#D10100;">Sign up</a>
        </div>
    </div>
</header>
