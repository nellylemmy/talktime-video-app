<!-- Authenticated top nav: matches the dashboard header (minimal black TALKTIME,
     bell, name, avatar). IDs are wired by nav-loader.js - do not rename:
     main-header, volunteer-greeting, volunteer-initial, nav-profile-image,
     notification-badge, profile-btn, profile-dropdown, logout-link -->
<header id="main-header" class="sticky top-0 z-40 bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto flex items-center justify-between h-16 px-4 sm:px-6">
        <!-- Logo - black, no gradient -->
        <a href="/" class="flex items-center gap-2" aria-label="TalkTime Home">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7" viewBox="0 0 24 24" fill="none">
                <path stroke="#111827" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 3h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2z"></path>
            </svg>
            <span class="font-bold text-gray-900 tracking-tight text-lg">TALKTIME</span>
        </a>

        <!-- Bell + profile -->
        <div class="flex items-center gap-2">
            <a href="/volunteer/notifications" class="relative p-2 rounded-lg hover:bg-gray-50 active:bg-gray-100 transition-colors" aria-label="Notifications">
                <i class="fas fa-bell text-gray-600 text-lg"></i>
                <span id="notification-badge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center px-1 hidden">0</span>
            </a>

            <div class="relative">
                <button id="profile-btn" class="flex items-center gap-2 md:gap-3 p-2 rounded-lg hover:bg-gray-50 active:bg-gray-100 transition-colors">
                    <span id="volunteer-greeting" class="text-sm font-medium text-gray-700 hidden sm:inline">Volunteer</span>
                    <img id="nav-profile-image" src="" alt="Profile" class="hidden w-9 h-9 md:w-10 md:h-10 rounded-full object-cover border-2 border-gray-200">
                    <div id="volunteer-initial" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-sm md:text-base">V</div>
                </button>

                <div id="profile-dropdown" style="display:none;" class="absolute right-0 top-full mt-2 w-56 md:w-64 bg-white rounded-xl shadow-lg py-2 z-50 border border-gray-100">
                    <div class="py-1 border-b border-gray-100">
                        <a href="/volunteer/profile" class="flex items-center gap-3 px-4 py-2.5 text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="fas fa-user-circle text-gray-400 w-5 text-center"></i>
                            <span>My Profile</span>
                        </a>
                        <a href="/volunteer/settings" class="flex items-center gap-3 px-4 py-2.5 text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="fas fa-cog text-gray-400 w-5 text-center"></i>
                            <span>Settings</span>
                        </a>
                        <a href="/volunteer/dashboard/feedback" class="flex items-center gap-3 px-4 py-2.5 text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="fas fa-comment-dots text-gray-400 w-5 text-center"></i>
                            <span>Send Feedback</span>
                        </a>
                    </div>
                    <div class="py-1 border-b border-gray-100">
                        <a href="/volunteer/dashboard/students" class="flex items-center gap-3 px-4 py-2.5 text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="fas fa-calendar-check text-gray-400 w-5 text-center"></i>
                            <span>My Schedules</span>
                        </a>
                        <a href="/" class="flex items-center gap-3 px-4 py-2.5 text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="fas fa-home text-gray-400 w-5 text-center"></i>
                            <span>Home</span>
                        </a>
                    </div>
                    <div class="py-1">
                        <a href="#" id="logout-link" class="flex items-center gap-3 px-4 py-2.5 text-red-600 hover:bg-red-50 transition-colors">
                            <i class="fas fa-sign-out-alt w-5 text-center"></i>
                            <span>Logout</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
